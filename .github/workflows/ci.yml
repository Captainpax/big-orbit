name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_versions.py
      - run: python scripts/check_docs.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify preinstalled Android SDK
        run: >-
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
          && test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
